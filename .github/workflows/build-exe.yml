name: Build EXE
on:
  push:
    branches: [ animated-version ] # Only runs when you update this branch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install pygame numpy pyinstaller
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole Play.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnimatedGameOfLife
        path: dist/Play.exe